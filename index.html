<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: на iPhone контент уходит под чёлку, отступы — env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>easyapps team</title>
    <meta name="description" content="Рабочее место команды easyapps: задачи и медиа" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA: «На экран Домой» открывает как приложение, без адресной строки -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F1F3F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="easyapps team" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    />

    <style>
      /* До загрузки стилей — тот же холст, без белой вспышки */
      html, body { background: #F1F3F6; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
